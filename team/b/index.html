function zeile(stand) {

function echt(t) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(t || "")); if (!m) return false; const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])); return d.getUTCDate() === +m[3] && d.getUTCMonth() === +m[2] - 1; }

  }

      richtig: "Richtigkeit", weiterverlauf: "wie geht es weiter", hoeflichkeit: "Höflichkeit", rueckfragen: "Rückfragen", beibehalten: "Deutsch beibehalten", standort: "Standort" };

    if (["richtig", "teils", "falsch"].includes(o.richtig) && (!/^https:\/\//.test(o.quelle_url || "") || !echt(o.quelle_datum) || o.quelle_datum > heute())) f.push("Quelle (https) und Abrufdatum zur Richtigkeit");
  } else if (o.code && !o.ausfall_grund) f.push("Grund");
