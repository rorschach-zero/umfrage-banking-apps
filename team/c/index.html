      el("div", {}, el("label", { class: "f" }, "Bemerkung ", el("span", { class: "hilfe" }, "Zweifel, angewendete Grenzregel")), el("input", { class: "t", value: c.bemerkung, on: { input: e => { c.bemerkung = e.target.value; lokal(draftKey(q[i]), c); } } }))),
