<style>
@font-face { font-family: "Nunito"; src: url("fonts/Nunito.ttf") format("truetype"); font-weight: 200 1000; font-display: swap; }
:root {
  --orange:#fa5b35; --ink:#151a21; --white:#fff; --grey:#666666; --line:#d0d1d3; --surface:#f2f2f2;

}
@media (prefers-reduced-motion: reduce) { :root { --dur: 0ms; } .schirm { animation: none; } }
* { box-sizing: border-box; }
html, body { margin:0; background: var(--white); color: var(--ink); font-family: "Nunito", Arial, sans-serif; font-size: 18px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body { min-height: 100dvh; display: flex; flex-direction: column; }
header { display:flex; align-items:center; justify-content:space-between; padding: 20px 24px; max-width: 760px; width:100%; margin:0 auto; }

@keyframes rein { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform:none; } }
.kicker { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--grey); font-weight: 600; margin-bottom: 8px; }
h1 { font-size: clamp(26px, 5vw, 36px); line-height: 1.1; letter-spacing: -0.02em; font-weight: 800; margin: 0 0 12px; }
h1::after { content:""; display:block; width: 48px; height: 4px; background: var(--orange); border-radius: 2px; margin-top: 14px; }
h2 { font-size: clamp(22px, 4vw, 28px); line-height: 1.2; letter-spacing: -0.015em; font-weight: 800; margin: 0 0 8px; }
p { margin: 0 0 12px; }
p.hinweis, .klein { color: var(--grey); font-size: 15px; }
.optionen { display:flex; flex-direction:column; gap: 10px; margin: 20px 0; }
.optionen.zeile { flex-direction: row; flex-wrap: wrap; }
.opt { display:flex; align-items:center; gap: 12px; padding: 14px 18px; border: 1.5px solid var(--line); border-radius: var(--pill); background: var(--white); cursor:pointer; font: inherit; color: var(--ink); text-align:left; transition: border-color var(--dur), background var(--dur), transform var(--dur); }

.opt .punkt { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.opt[aria-checked="true"] .punkt { border-color: var(--orange); background: var(--orange); box-shadow: inset 0 0 0 4px #fff; }
.opt.multi .punkt { border-radius: 6px; }
.text { width:100%; font: inherit; padding: 14px 18px; border: 1.5px solid var(--line); border-radius: var(--card); margin-top: 8px; }
.text:focus { outline: 3px solid var(--lavender); border-color: var(--ink); }
textarea.text { min-height: 110px; resize: vertical; }
.skala { display:grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 16px 0 6px; }
.skala .opt { justify-content:center; padding: 14px 6px; border-radius: var(--card); font-weight: 700; }
.skala-enden { display:flex; justify-content:space-between; color: var(--grey); font-size: 14px; }
.matrix { display:flex; flex-direction:column; gap: 16px; margin: 24px 0; }
.matrix .zeile { padding: 16px; border-radius: var(--card); background: var(--lilac-faint); }
.matrix .zeile .frage { font-weight: 600; margin-bottom: 8px; }
.matrix .skala { margin: 8px 0 4px; }
.matrix .skala .opt { padding: 10px 4px; font-size: 15px; background: var(--white); }
.extra { margin-top: 10px; }
.nav { display:flex; justify-content:space-between; align-items:center; gap: 12px; margin-top: 28px; }
.knopf { font: inherit; font-size: 19px; font-weight: 800; padding: 14px 26px; border-radius: var(--pill); border: 0; background: var(--orange); color: #fff; cursor:pointer; transition: transform var(--dur) var(--ease), opacity var(--dur); }
.knopf:hover { transform: translateY(-1px); }
.knopf:disabled { opacity: .35; cursor: not-allowed; transform:none; }
.knopf.leise { background: transparent; color: var(--grey); }
.fehler { color: var(--red); font-size: 15px; min-height: 22px; margin-top: 8px; }
.fehler:focus { outline: none; }
.stern { color: var(--orange); }
.legende { color: var(--grey); font-size: 14px; margin: 6px 0 0; }
label.feld { display:block; font-weight: 600; margin-top: 8px; }
.status { margin-top: 16px; }
.ok { color: var(--green-dark); }
.botschaft { background: var(--lilac-light); border-radius: 24px; padding: 28px; font-size: clamp(22px, 4vw, 28px); font-weight: 800; letter-spacing: -0.01em; line-height: 1.25; margin: 20px 0; }
.sprachen { display:flex; flex-wrap:wrap; gap: 8px; margin: 4px 0 18px; }
.sprache { font: inherit; font-size: 14px; font-weight: 700; padding: 8px 14px; border: 1.5px solid var(--line); border-radius: var(--pill); background: var(--white); color: var(--ink); cursor:pointer; }
.sprache[aria-pressed="true"] { border-color: var(--orange); background: var(--orange); color: #fff; }
.sprache:focus-visible { outline: 3px solid var(--lavender); outline-offset: 2px; }
.kurz { margin: 4px 0 14px; color: var(--grey); font-size: 15px; }
.gewinn { display:inline-block; align-self:flex-start; background: var(--lilac-faint); border-radius: 999px; padding: 8px 14px; font-size: 15px; font-weight: 600; margin: 0 0 4px; }
.schirm.start { display:flex; flex-direction:column; }
.schirm.start .start-unten { order: 10; margin-top: 18px; }
.schirm.start .start-unten .hinweis { margin: 0 0 6px; text-align:center; }
.schirm.start details { margin: 0; border-top: 1px solid #ebebee; }
.schirm.start details:last-child { border-bottom: 1px solid #ebebee; }
.kurz b { color: var(--ink); }
.verlosung { background: var(--lilac-faint); border-radius: var(--card); padding: 14px 16px; font-size: 15px; line-height: 1.45; }
.verlosung b { display:block; margin-bottom: 2px; }
.verlosung a { color: var(--ink); font-weight: 700; }
.teilen { display:flex; flex-wrap:wrap; justify-content:center; gap: 8px; margin-top: 10px; }
.fakten { display:block; margin: 20px 0 8px; border-top: 1px solid var(--line); }
.fakt { display:flex; gap: 10px; align-items:baseline; padding: 10px 0; border-bottom: 1px solid var(--line); }
.fakt::before { content: "✓"; color: var(--orange); font-weight: 700; flex: 0 0 auto; }
.fakt b { font-size: 15px; white-space: nowrap; }
.fakt > span { color: var(--grey); font-size: 14px; line-height: 1.35; display:block; }
details { margin: 14px 0 0; }
details summary { cursor:pointer; color: var(--ink); font-weight: 600; font-size: 15px; list-style: none; display:flex; align-items:center; gap: 8px; min-height: 44px; padding: 8px 0; }
details summary::-webkit-details-marker { display:none; }
details summary::before { content:""; width: 8px; height: 8px; border-right: 2px solid var(--orange); border-bottom: 2px solid var(--orange); transform: rotate(-45deg); transition: transform var(--dur); }
details[open] summary::before { transform: rotate(45deg); }
details p { margin: 10px 0 0; color: var(--grey); font-size: 15px; }
@media (max-width: 520px) { .fakt { flex-wrap: wrap; } }
.ende { text-align:center; padding: 40px 0; }
.ende .gross { font-size: clamp(40px, 10vw, 72px); font-weight: 800; letter-spacing: -0.03em; color: var(--orange); line-height: 1; }
footer { text-align:center; color: var(--grey); font-size: 13px; padding: 16px 24px 28px; }
.sr { position:absolute; left:-9999px; }
@media (max-width: 520px) { header .marke span { display:none; } .skala .opt { padding: 12px 2px; font-size: 14px; } .skala.worte { grid-template-columns: 1fr; } .skala.worte .opt { justify-content:flex-start; text-align:left; padding: 12px 16px; font-size: 16px; } .nav { flex-direction: column-reverse; align-items: stretch; } .knopf { width:100%; } }
</style>
</head>

<script>
/* ---------- Konfiguration ---------- */
const ENDPUNKT = "https://script.google.com/macros/s/AKfycbxpPEfT4vd5-jXe3YAc6zl0HKgLV4oVRmLOHDZzGcbaqYryEv7xgkORDSjhnHg5Lp2Y0Q/exec";
const BOTSCHAFTEN_AKTIV = false;   // Botschaftentest gestrichen nach Pruefung m2 (29.10.): A und B werden vorher erklaert, C nicht, kein fairer Vergleich
const DAUER_TEXT = "sechs bis acht Minuten"; // Pretest 29.10.2026: 3:40, 4:22, 6:00, 8:00
const VERSION = "3.22";                   // Stand des Fragebogens, wird mitgespeichert
const KONTAKT = "umfrage@hydeout.ch";    // Kontakt der Studierendengruppe fuer Rueckfragen
// Sprachen: die Seite zeigt Deutsch, Franzoesisch, Italienisch oder Englisch (Woerterbuch in sprachen.js, Schluessel ist der
// deutsche Wortlaut). Gespeichert werden immer die deutschen Antwortwerte; die gewaehlte Sprache steht in der Spalte «sprache».
const SPRACHEN_LISTE = {de:"Deutsch", fr:"Français", it:"Italiano", en:"English"};
let SPRACHE = (new URLSearchParams(location.search).get("lang") || "").toLowerCase(); if (!Object.hasOwn(SPRACHEN_LISTE, SPRACHE)) SPRACHE = "";
const t = s => { if (typeof s !== "string" || !SPRACHE || SPRACHE === "de") return s; const w = (typeof SPRACHEN !== "undefined" && SPRACHEN[SPRACHE]) ? SPRACHEN[SPRACHE][s] : undefined; return w === undefined ? s : w; };
const tf = (s, app) => t(s).replace("{app}", () => app);
const tbLink = () => (!SPRACHE || SPRACHE === "de") ? "teilnahmebedingungen.html" : "teilnahmebedingungen_" + SPRACHE + ".html";
const teilLink = () => "https://rorschach-zero.github.io/umfrage-banking-apps/?id=TEIL-" + ((SPRACHE && SPRACHE !== "de") ? "&lang=" + SPRACHE : "");
const dsLink = () => (!SPRACHE || SPRACHE === "de") ? "datenschutz.html" : "datenschutz_" + SPRACHE + ".html";
function spracheAnwenden() { document.documentElement.lang = (SPRACHE || "de") + (SPRACHE === "de" || !SPRACHE ? "-CH" : ""); document.title = t("Umfrage Kundendienst von Banking-Apps"); const kz = document.getElementById("kopfzeile"); if (kz) kz.textContent = t("Praxisarbeit HFW"); const f = document.querySelector("footer"); if (f) f.textContent = t("Praxisarbeit HFW von Studierenden der KV Business School Zürich, Klasse 601/H25-B · ohne Namen und Kontodaten · Daten nur für diese Arbeit"); }

const APPS_FEST = ["Yuh","Neon","Zak","Revolut"];
function mischen(a) { const b = a.slice(); for (let k = b.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [b[k], b[j]] = [b[j], b[k]]; } return b; }
let APPS = ["App meiner Hausbank"].concat(mischen(APPS_FEST), ["andere"]); // Hausbank zuoberst (Pretest: fast alle suchen sie zuerst), die vier Neobanken gemischt // Reihenfolge je Teilnahme zufaellig, wird als «reihenfolge» gespeichert
const MERKMALE = [
  "Ich erhalte rasch eine Antwort von einem Menschen",
  "Mein Anliegen wird beim ersten Kontakt gelöst",
  "Ich kann mich direkt mit einem Menschen austauschen",
  "Erreichbar am Abend",
  "Erreichbar am Wochenende",
  "Erreichbar per Telefon",
  "Die Mitarbeitenden sind in der Schweiz",
  "Antwort in der Sprache, die ich bevorzuge",
  "Ich erfahre, wie es mit meinem Anliegen weitergeht",
  "Ich kann ein Problem selbst in der App lösen, ohne jemanden zu kontaktieren"
];
let MERK_ORDER = mischen([...Array(MERKMALE.length).keys()]); // Zeilen der Matrizen je Teilnahme gemischt, in allen Matrizen gleich; Schluessel bleiben an der Originalzeile
const KANTONE = ["Aargau","Appenzell Ausserrhoden","Appenzell Innerrhoden","Basel-Landschaft","Basel-Stadt","Bern","Freiburg","Genf","Glarus","Graubünden","Jura","Luzern","Neuenburg","Nidwalden","Obwalden","Schaffhausen","Schwyz","Solothurn","St. Gallen","Tessin","Thurgau","Uri","Waadt","Wallis","Zug","Zürich"];
const BOTSCHAFTEN = {A:"Bei Yuh antwortet dir eine Person in der Schweiz.", B:"Bei Yuh erreichst du den Kundendienst auch per Telefon.", C:"Bei Yuh hilft dir der Kundendienst in vier Sprachen."};
const S5 = (a,b)=>({stufen:5, links:a, rechts:b});

/* ---------- Antworten ---------- */
function merk(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { return null; } }
let idAusAdresse = (new URLSearchParams(location.search).get("id")||"").replace(/[^A-Za-z0-9_-]/g,"").slice(0,16);
// Ein Kanal-Praefix wie «AD-» gilt fuer viele Personen: dann bekommt jede Teilnahme eine eigene Kennung dahinter.
if (idAusAdresse.endsWith("-")) {
  let fruehere = null; try { const g = JSON.parse(merk("stand") || "null"); if (g && g.A && typeof g.A.id === "string" && g.A.id.startsWith(idAusAdresse)) fruehere = g.A.id; } catch (e) {}
  idAusAdresse = fruehere || (idAusAdresse + Math.random().toString(36).slice(2,8));
}
const A = { id: idAusAdresse || merk("id") || Math.random().toString(36).slice(2,10), variante: merk("variante") || ["A","B","C"][Math.floor(Math.random()*3)], geraet: /Mobi/.test(navigator.userAgent) ? "mobil" : "desktop" };
merk("id", A.id); merk("variante", A.variante); A.reihenfolge = APPS.slice(1, 5).join("|"); A.merkmale_reihenfolge = MERK_ORDER.map(i => i + 1).join("|");
let start = Date.now();
// Neuladen mitten in der Umfrage (am Handy reicht ein Wischen nach unten) darf die Antworten nicht loeschen.
// Der Stand liegt nur im sessionStorage dieses Tabs: er verlaesst das Geraet nicht und ist mit dem Tab weg.
let wiederherstellen = null;
try { const g = JSON.parse(merk("stand") || "null"); if (g && g.v === VERSION && g.A && g.A.id === A.id) wiederherstellen = g; } catch (e) { wiederherstellen = null; }
if (wiederherstellen) {
  Object.assign(A, wiederherstellen.A);
  const istPerm = (liste, soll) => liste.length === soll.length && soll.every(x => liste.includes(x));
  if (A.reihenfolge && istPerm(A.reihenfolge.split("|"), APPS_FEST)) APPS = ["App meiner Hausbank"].concat(A.reihenfolge.split("|"), ["andere"]); else A.reihenfolge = APPS.slice(1, 5).join("|");
  if (A.merkmale_reihenfolge && istPerm(A.merkmale_reihenfolge.split("|").map(Number), [...Array(MERKMALE.length).keys()].map(n => n + 1))) MERK_ORDER = A.merkmale_reihenfolge.split("|").map(n => Number(n) - 1); else A.merkmale_reihenfolge = MERK_ORDER.map(i => i + 1).join("|");
  if (wiederherstellen.start) start = wiederherstellen.start;
  if (!SPRACHE && Object.hasOwn(SPRACHEN_LISTE, String(A.sprache))) SPRACHE = A.sprache;
}
if (!SPRACHE) SPRACHE = "de"; A.sprache = SPRACHE;
function sichern() { try { merk("stand", JSON.stringify({v: VERSION, A: A, i: i, start: start})); } catch (e) {} }
window.addEventListener("beforeunload", sichern); window.addEventListener("pagehide", sichern); document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") sichern(); });
const hauptapp = () => A.t2 || (Array.isArray(A.t1) && A.t1.length === 1 ? A.t1[0] : "");
const nutztYuh = () => Array.isArray(A.t1) && (A.t1.includes("Yuh") || (A.t1.includes("andere") && /yuh/i.test(A.t1_andere || "")));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Eingetippte Namen stehen spaeter in Fragetiteln, die als HTML gesetzt werden: darum hier maskiert.
const anzeige = o => o==="App meiner Hausbank" ? (A.t1_hausbank ? esc(A.t1_hausbank) : t("deiner Hausbank")) : (o==="andere" && A.t1_andere ? esc(A.t1_andere) : esc(o));
const hauptappName = () => anzeige(hauptapp());
const kenntYuh = () => nutztYuh() || A.t13a === "ja" || A.t6 === "Yuh" || A.t3c_app === "Yuh";   // Yuh-Nutzende kennen Yuh; t13a wird fuer sie nicht gezeigt und beim Senden auf «ja» gesetzt

/* ---------- Bildschirme ---------- */
const S = [
 {id:"start", art:"info", kicker:"Praxisarbeit HFW", titel:"Umfrage zu Banking-Apps", text:`Fünf Studierende der KV Business School Zürich fragen dich nach deiner Banking-App und ihrem Kundendienst.`, html: () => `<div class="sprachen" role="group" aria-label="${t("Sprache")}">${Object.keys(SPRACHEN_LISTE).map(k => `<button type="button" class="sprache" data-lang="${k}" aria-pressed="${SPRACHE===k}" lang="${k}">${SPRACHEN_LISTE[k]}</button>`).join("")}</div><p class="kurz"><b>${t(DAUER_TEXT)}</b> · ${t("ohne Namen und Kontodaten")}</p><p class="gewinn">${t("Zu gewinnen gibt es einen Galaxus-Gutschein von 100 Franken.")}</p><div class="start-unten"><p class="hinweis">${t("Mit «Los» stimmst du der Teilnahme zu.")} <a href="${dsLink()}" target="_blank" rel="noopener">${t("Datenschutz zur Umfrage")}</a></p><details><summary>${t("Mehr zur Verlosung")}</summary><p>${t("Unter allen vollständigen Antworten mit Mailadresse verlosen wir einen Galaxus-Gutschein im Wert von 100 Franken (16 bis 65 Jahre, Wohnsitz Schweiz).")} <a href="${tbLink()}" target="_blank" rel="noopener">${t("Teilnahmebedingungen")}</a></p></details><details><summary>${t("Datenschutz und Teilnahme")}</summary><p>${t("Gehörst du nicht zur Zielgruppe (Schweiz, 16 bis 65, Banking-App), endet die Umfrage nach bis zu drei Fragen; gespeichert werden dann nur diese Antworten.")} ${t("Die Rohdaten bleiben bei der Studierendengruppe, der Praxispartner wird am Ende genannt.")} ${t("Fragen mit Stern sind Pflicht.")}</p></details></div>`, knopf:"Los"},
 {id:"s1", art:"einfach", pflicht:true, titel:"Wohnst du in der Schweiz?", optionen:["ja","nein"], ende: v => v==="nein"},
 {id:"s2", art:"einfach", pflicht:true, titel:"Wie alt bist du?", optionen:["unter 16","16 bis 29","30 bis 49","50 bis 65","über 65"], ende: v => v==="unter 16"||v==="über 65"},
 {id:"s3", art:"einfach", pflicht:true, titel:"Nutzt du zurzeit mindestens eine Banking-App auf dem Handy?", optionen:["ja","nein"], ende: v => v==="nein"},
 {id:"t0", art:"offen", pflicht:false, titel:"Welche Banking-Apps kennst du, auch wenn du sie nicht nutzt?", hinweis:"Schreib bis zu drei Namen, die dir als Erstes einfallen. Freiwillig."},
 {id:"t1", art:"mehrfach", pflicht:true, titel:"Welche dieser Banking-Apps nutzt du zurzeit?", hinweis:"Mehrfachauswahl möglich.", optionen:APPS, texte:{"App meiner Hausbank":{key:"t1_hausbank", label:"Welche Bank?"}, "andere":{key:"t1_andere", label:"Welche App?"}}},
 {id:"t2", art:"einfach", pflicht:true, titel:"Welche davon nutzt du am häufigsten?", optionen: () => A.t1, zeigen: () => Array.isArray(A.t1) && A.t1.length > 1},
 {id:"t2b", art:"einfach", pflicht:true, titel: () => tf("Welche Rolle spielt {app} für dich?", hauptappName()), optionen:["meine wichtigste Bankverbindung, der Lohn oder das Haupteinkommen kommt dort an","meine wichtigste Bankverbindung, aber das Haupteinkommen kommt woanders an","ein Zweitkonto für bestimmte Zwecke","ich habe kein regelmässiges Einkommen","keine Angabe"]},
 {id:"t3b", art:"einfach", pflicht:true, titel: () => tf("Als du zuletzt ein Problem mit {app} hattest: Was hast du zuerst getan?", hauptappName()), optionen:["Hilfe in der App oder bei den häufigen Fragen gesucht","Im Internet gesucht","Den Chatbot der App genutzt","Den Mitarbeitenden geschrieben, per Chat oder E-Mail","Angerufen","Bekannte gefragt","Zunächst nichts","Anderes","Ich hatte noch nie ein Problem","Weiss ich nicht mehr"]},
 {id:"t3c", art:"einfach", pflicht:true, titel:"Hast du in den letzten zwölf Monaten eine Banking-App wegen eines Problems, das nicht gelöst wurde, seltener oder gar nicht mehr genutzt?", hinweis:"Wenn das bei mehreren Apps vorkam: Denk an die letzte.", optionen:["ja","nein","weiss nicht"]},

async function post(obj) {
