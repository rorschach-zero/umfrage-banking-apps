<style>
@font-face { font-family: "Nunito"; src: url("fonts/Nunito.ttf") format("truetype"); font-weight: 200 1000; font-display: swap; }
:root {
  --orange:#fa5b35; --ink:#151a21; --white:#fff; --grey:#666666; --line:#d0d1d3; --surface:#f2f2f2;
  --lavender:#babde4; --lilac:#ccb1da; --lilac-light:#ebddf5; --lilac-faint:#f6f1f9; --green:#02b089; --green-dark:#00795e; --red:#d92d20;
  --pill:100px; --card:16px; --dur:320ms; --ease:cubic-bezier(.165,.84,.44,1);
}
@media (prefers-reduced-motion: reduce) { :root { --dur: 0ms; } .schirm { animation: none; } }
* { box-sizing: border-box; }
html, body { margin:0; background: var(--white); color: var(--ink); font-family: "Nunito", Arial, sans-serif; font-size: 18px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body { min-height: 100dvh; display: flex; flex-direction: column; }
header { display:flex; align-items:center; justify-content:space-between; padding: 20px 24px; max-width: 760px; width:100%; margin:0 auto; }
header .marke { display:flex; align-items:center; gap:12px; color: var(--grey); font-size: 14px; }
header .marke img { height: 44px; width:auto; display:block; }
header .marke span { padding-top: 2px; }
.fortschritt { height: 4px; background: var(--surface); }
.fortschritt > div { height: 100%; width: 0; background: var(--orange); transition: width var(--dur) var(--ease); }
main { flex:1; max-width: 760px; width:100%; margin: 0 auto; padding: 24px 24px 48px; }
.schirm { animation: rein var(--dur) var(--ease); }
@keyframes rein { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform:none; } }
.kicker { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--grey); font-weight: 600; margin-bottom: 8px; }
h1 { font-size: clamp(26px, 5vw, 36px); line-height: 1.1; letter-spacing: -0.02em; font-weight: 800; margin: 0 0 12px; }
h1::after { content:""; display:block; width: 48px; height: 4px; background: var(--orange); border-radius: 2px; margin-top: 10px; }
h2 { font-size: clamp(22px, 4vw, 28px); line-height: 1.2; letter-spacing: -0.015em; font-weight: 800; margin: 0 0 8px; }
p { margin: 0 0 12px; }
p.hinweis, .klein { color: var(--grey); font-size: 15px; }
.optionen { display:flex; flex-direction:column; gap: 10px; margin: 20px 0; }
.optionen.zeile { flex-direction: row; flex-wrap: wrap; }
.opt { display:flex; align-items:center; gap: 12px; padding: 14px 18px; border: 1.5px solid var(--line); border-radius: var(--pill); background: var(--white); cursor:pointer; font: inherit; color: var(--ink); text-align:left; transition: border-color var(--dur), background var(--dur), transform var(--dur); }
.opt:hover { border-color: var(--ink); }
.opt:focus-visible { outline: 3px solid var(--lavender); outline-offset: 2px; }
.opt[aria-checked="true"], .opt.aktiv { border-color: var(--orange); background: #fff1ec; }
.opt .punkt { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.opt[aria-checked="true"] .punkt { border-color: var(--orange); background: var(--orange); box-shadow: inset 0 0 0 4px #fff; }
.opt.multi .punkt { border-radius: 6px; }
.text { width:100%; font: inherit; padding: 14px 18px; border: 1.5px solid var(--line); border-radius: var(--card); margin-top: 8px; }
.text:focus { outline: 3px solid var(--lavender); border-color: var(--ink); }
textarea.text { min-height: 110px; resize: vertical; }
.skala { display:grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 16px 0 6px; }
.skala .opt { justify-content:center; padding: 14px 6px; border-radius: var(--card); font-weight: 700; }
.skala-enden { display:flex; justify-content:space-between; color: var(--grey); font-size: 14px; }
.matrix { display:flex; flex-direction:column; gap: 16px; margin: 24px 0; }
.matrix .zeile { padding: 16px; border-radius: var(--card); background: var(--lilac-faint); }
.matrix .zeile .frage { font-weight: 600; margin-bottom: 8px; }
.matrix .skala { margin: 8px 0 4px; }
.matrix .skala .opt { padding: 10px 4px; font-size: 15px; background: var(--white); }
.extra { margin-top: 10px; }
.nav { display:flex; justify-content:space-between; align-items:center; gap: 12px; margin-top: 28px; }
.knopf { font: inherit; font-size: 19px; font-weight: 800; padding: 14px 26px; border-radius: var(--pill); border: 0; background: var(--orange); color: #fff; cursor:pointer; transition: transform var(--dur) var(--ease), opacity var(--dur); }
.knopf:hover { transform: translateY(-1px); }
.knopf:disabled { opacity: .35; cursor: not-allowed; transform:none; }
.knopf.leise { background: transparent; color: var(--grey); }
.fehler { color: var(--red); font-size: 15px; min-height: 22px; margin-top: 8px; }
.fehler:focus { outline: none; }
.stern { color: var(--orange); }
.legende { color: var(--grey); font-size: 14px; margin: 6px 0 0; }
label.feld { display:block; font-weight: 600; margin-top: 8px; }
.status { margin-top: 16px; }
.ok { color: var(--green-dark); }
.botschaft { background: var(--lilac-light); border-radius: 24px; padding: 28px; font-size: clamp(22px, 4vw, 28px); font-weight: 800; letter-spacing: -0.01em; line-height: 1.25; margin: 20px 0; }
.sprachen { display:flex; flex-wrap:wrap; gap: 6px; margin: 2px 0 12px; }
.sprache { font: inherit; font-size: 13px; font-weight: 700; padding: 7px 11px; border: 1.5px solid var(--line); border-radius: var(--pill); background: var(--white); color: var(--ink); cursor:pointer; }
.sprache[aria-pressed="true"] { border-color: var(--orange); background: var(--orange); color: #fff; }
.sprache:focus-visible { outline: 3px solid var(--lavender); outline-offset: 2px; }
.kurz { margin: 2px 0 10px; color: var(--grey); font-size: 15px; }
.gewinn { display:flex; align-items:center; gap: 14px; background: var(--lilac-light); border-radius: var(--card); padding: 14px 16px; margin: 2px 0 0; }
.gewinn .ikon { flex:none; width: 44px; height: 44px; border-radius: 50%; background: var(--orange); display:flex; align-items:center; justify-content:center; }
.gewinn .klein { font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); font-weight: 800; margin-bottom: 2px; }
.gewinn b { display:block; font-size: 17px; line-height: 1.3; }
.gewinn .sub { margin: 2px 0 0; font-size: 14px; color: var(--grey); }
.schirm.start .nav { justify-content:flex-start; margin-top: 10px; }
.schirm.start .nav > span:not(.weiter-gruppe) { display:none; }
.schirm.start .nav .knopf { min-width: 240px; }
.schirm.start { display:flex; flex-direction:column; }
.schirm.start .start-unten { order: 10; margin-top: 12px; }
.schirm.start .start-unten .hinweis { margin: 0 0 14px; text-align:left; }
.schirm.start details { margin: 0; border-top: 1px solid #ebebee; }
.schirm.start details:last-child { border-bottom: 1px solid #ebebee; }
.kurz b { color: var(--ink); }
.verlosung { background: var(--lilac-faint); border-radius: var(--card); padding: 14px 16px; font-size: 15px; line-height: 1.45; }
.verlosung b { display:block; margin-bottom: 2px; }
.verlosung a { color: var(--ink); font-weight: 700; }
.teilen { display:flex; flex-direction:column; gap: 6px; margin-top: 12px; }
.teilen a.knopf { display:block; text-align:center; text-decoration:none; }
.teilen-zweit { display:flex; justify-content:center; gap: 8px; }
.teilen-zweit .knopf.leise { width:auto; padding: 10px 14px; font-size: 16px; }
.karte { background: var(--lilac-faint); border-radius: var(--card); padding: 16px; margin-top: 14px; text-align:left; }
.karte b { display:block; font-size: 17px; }
.karte-text { margin: 6px 0 0; color: var(--grey); font-size: 15px; }
.karte details, .kennung-box { text-align:left; }
.kennung-box { margin-top: 10px; }
.hinweis.klein { font-size: 13px; margin: 8px 0 0; }
.ende .gross { margin-bottom: 6px; }
.fakten { display:block; margin: 20px 0 8px; border-top: 1px solid var(--line); }
.fakt { display:flex; gap: 10px; align-items:baseline; padding: 10px 0; border-bottom: 1px solid var(--line); }
.fakt::before { content: "✓"; color: var(--orange); font-weight: 700; flex: 0 0 auto; }
.fakt b { font-size: 15px; white-space: nowrap; }
.fakt > span { color: var(--grey); font-size: 14px; line-height: 1.35; display:block; }
details { margin: 14px 0 0; }
details summary { cursor:pointer; color: var(--ink); font-weight: 600; font-size: 15px; list-style: none; display:flex; align-items:center; gap: 8px; min-height: 44px; padding: 8px 0; }
details summary::-webkit-details-marker { display:none; }
details summary::before { content:""; width: 8px; height: 8px; border-right: 2px solid var(--orange); border-bottom: 2px solid var(--orange); transform: rotate(-45deg); transition: transform var(--dur); }
details[open] summary::before { transform: rotate(45deg); }
details p { margin: 10px 0 0; color: var(--grey); font-size: 15px; }
@media (max-width: 520px) { .fakt { flex-wrap: wrap; } }
.ende { text-align:center; padding: 40px 0; }
.ende .gross { font-size: clamp(40px, 10vw, 72px); font-weight: 800; letter-spacing: -0.03em; color: var(--orange); line-height: 1; }
footer { text-align:center; color: var(--grey); font-size: 13px; padding: 16px 24px 28px; }
.sr { position:absolute; left:-9999px; }
@media (max-width: 520px) { header .marke span { display:none; } .skala .opt { padding: 12px 2px; font-size: 14px; } .skala.worte { grid-template-columns: 1fr; } .skala.worte .opt { justify-content:flex-start; text-align:left; padding: 12px 16px; font-size: 16px; } .nav { flex-direction: column-reverse; align-items: stretch; } .knopf { width:100%; } }

/* Typeform-Gefühl, neutral (Claudette 03.11.2026, Impeccable): nur Gestaltung, Instrument unverändert. */
:root { --akzent-text:#d4431f; }
::selection { background: #ffd9cf; color: var(--ink); }
html { caret-color: var(--orange); scrollbar-color: #c9cbcf transparent; }
header { padding: 18px 24px 14px; }
header #zaehler { font-size: 14px; color: var(--grey); font-variant-numeric: tabular-nums; }
.fortschritt { height: 3px; background: #efeff1; }
main { padding: clamp(28px, 7vh, 72px) 24px 56px; max-width: 720px; }
.schirm { animation: rein 420ms cubic-bezier(.16,1,.3,1); }
@keyframes rein { from { opacity:0; transform: translateY(12px); filter: blur(2px); } to { opacity:1; transform:none; filter:none; } }
h1::after { display:none; }
h1 { font-size: clamp(30px, 6vw, 44px); line-height: 1.08; letter-spacing: -0.025em; margin-bottom: 14px; text-wrap: balance; }
h2 { font-size: clamp(24px, 4.6vw, 32px); line-height: 1.18; letter-spacing: -0.02em; font-weight: 750; margin: 0 0 10px; text-wrap: balance; }
p.hinweis { font-size: 16px; max-width: 62ch; }
.optionen { gap: 8px; margin: 26px 0 8px; counter-reset: wahl; max-width: 560px; }
.optionen .opt { border-radius: 10px; padding: 12px 16px 12px 12px; border-width: 1.5px; background: #fff; transition: border-color 160ms ease, background-color 160ms ease, transform 120ms ease; }
.optionen .opt:active { transform: scale(.995); }
.optionen .opt .punkt { display:none; }
.optionen .opt::before { counter-increment: wahl; content: counter(wahl, upper-alpha); flex: none; width: 26px; height: 26px; border-radius: 6px; border: 1.5px solid var(--line); display:grid; place-items:center; font-size: 13px; font-weight: 800; color: var(--grey); background:#fff; transition: inherit; }
.optionen .opt[aria-checked="true"] { border-color: var(--orange); background: #fff4f0; }
.optionen .opt[aria-checked="true"]::before { background: var(--orange); border-color: var(--orange); color: #fff; }
.optionen .opt.multi[aria-checked="true"]::after { content:""; margin-left:auto; width: 10px; height: 16px; border: solid var(--akzent-text); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-2px,-2px); }
.skala { gap: 6px; max-width: 560px; }
.skala .opt { border-radius: 10px; }
.skala .opt[aria-checked="true"] { background: var(--orange); border-color: var(--orange); color:#fff; }
.matrix .zeile { background: #f7f7f8; border-radius: 12px; }
.matrix .skala .opt[aria-checked="true"] { color:#fff; }
.knopf { background: var(--akzent-text); border-radius: 10px; font-size: 18px; padding: 13px 26px; box-shadow: 0 1px 2px rgba(21,26,33,.12); }
.knopf.leise { box-shadow:none; }
.knopf:focus-visible, .opt:focus-visible, .sprache:focus-visible { outline: 3px solid #f4a28c; outline-offset: 2px; }
.weiter-gruppe { display:inline-flex; align-items:center; gap: 12px; }
.taste { font-size: 13px; color: var(--grey); white-space: nowrap; }
@media (hover: none), (max-width: 520px) { .taste { display:none; } .optionen .opt::before { display:none; } .optionen .opt { padding-left: 16px; } .optionen .opt .punkt { display:block; } }
.text { border-radius: 10px; }
.text:focus { outline: 3px solid #f4a28c; outline-offset: 1px; border-color: var(--ink); }
.botschaft { border-radius: 16px; }
.gewinn { border-radius: 12px; }
@media (prefers-reduced-motion: reduce) { .schirm { animation: none; } .optionen .opt { transition: none; } }
@media (max-width: 520px) { h2 { font-size: clamp(21px, 5.6vw, 26px); } h1 { font-size: clamp(28px, 8vw, 36px); } main { padding-top: 24px; } }
.skala.worte .opt { font-weight: 500; }
main a, footer a { color: var(--ink); text-decoration-color: var(--orange); text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
main a:hover { text-decoration-thickness: 2.5px; }

/* Neutrale Welt (Claudette 03.11.2026): keine Bankfarben. Anker ist das Schul-Navy des Absenders (#001B35), sonst Papierweiss und Tinte. */
:root { --orange:#001B35; --akzent-text:#001B35; --ink:#14171c; --grey:#5d636b; --line:#d6d9de; --surface:#f1f2f4;
  --lavender:#9aa6b8; --lilac:#e3e6eb; --lilac-light:#f3f4f6; --lilac-faint:#f6f7f8; --papier:#fbfbfa; --tint:#eef1f5; }
html, body { background: var(--papier); }
::selection { background: #d5dceb; }
html { caret-color: #001B35; }
.fortschritt > div { background: #001B35; }
.optionen .opt[aria-checked="true"], .skala .opt[aria-checked="true"] { background: var(--tint); border-color: #001B35; }
.skala .opt[aria-checked="true"], .matrix .skala .opt[aria-checked="true"] { background:#001B35; color:#fff; }
.optionen .opt[aria-checked="true"]::before { background:#001B35; border-color:#001B35; color:#fff; }
.optionen .opt.multi[aria-checked="true"]::after { border-color:#001B35; }
.stern { color: #8a93a0; }
.knopf { background:#001B35; box-shadow: 0 1px 2px rgba(0,27,53,.18), 0 6px 16px -8px rgba(0,27,53,.35); }
.knopf:hover { background:#0a2a4d; }
.knopf:focus-visible, .opt:focus-visible, .sprache:focus-visible, main a:focus-visible { outline: 3px solid #3d5f94; outline-offset: 2px; }
.text:focus { outline: 3px solid #3d5f94; }
main a, footer a { text-decoration-color: #9aa6b8; }
.botschaft { background: var(--tint); }
.ende .gross { color:#001B35; }
.fakt::before { color:#001B35; }
details summary::before { border-color: #5d636b; }



/* Startseite (03.11. abends, nach Recherche): links Text und Knopf, rechts der Gewinn als Bild; Handy gestapelt.
   Fluid mit clamp(rem + vw), keine zoom-Skalierung (WCAG 1.4.4). */
main:has(.schirm.start) { max-width: 1180px; padding-top: clamp(24px, 6vh, 64px); }
header:has(+ * .schirm.start), body:has(.schirm.start) header { max-width: 1180px; }
.schirm.start { display:grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); grid-template-areas: "spr bild" "titel bild" "text bild" "nav bild" "kurz bild" "unten bild"; column-gap: clamp(32px, 6vw, 96px); align-content:center; align-items:start; min-height: calc(100dvh - 200px); }
.schirm.start > .sprachen { grid-area: spr; display:flex; flex-wrap:wrap; gap: 8px; margin: 0 0 clamp(20px, 4vh, 40px); }
.schirm.start .sprache { display:inline-flex; align-items:center; gap: 8px; font-size: 0.875rem; font-weight: 600; color: var(--ink); background:#fff; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px 7px 9px; transition: border-color 160ms, background-color 160ms, color 160ms; }
.schirm.start .sprache:hover { border-color: #9aa6b8; }
.schirm.start .sprache[aria-pressed="true"] { border-color:#001B35; background:#001B35; color:#fff; }
.flagge { display:inline-flex; width: 21px; height: 14px; border-radius: 3px; overflow:hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.14); flex:none; }
.flagge svg { width:100%; height:100%; display:block; }
.schirm.start > h1 { grid-area: titel; font-size: clamp(2.25rem, 1.4rem + 3.4vw, 4.25rem); line-height: 1.0; letter-spacing: -0.035em; margin: 0 0 clamp(14px, 2vh, 22px); max-width: 12ch; }
.schirm.start > p:not(.kurz) { grid-area: text; font-size: clamp(1.125rem, 1rem + 0.5vw, 1.375rem); line-height: 1.45; color: #3a4048; max-width: 30ch; margin: 0 0 clamp(24px, 4vh, 36px); }
.schirm.start > .fehler { grid-area: nav; }
.schirm.start > .nav { grid-area: nav; margin: 0; justify-content:flex-start; }
.schirm.start .nav .knopf { min-width: 0; padding: 18px 30px; font-size: 1.1875rem; border-radius: 14px; }
.schirm.start .nav .knopf::after { content: "\2192"; margin-left: 10px; display:inline-block; transition: transform 180ms cubic-bezier(.16,1,.3,1); }
.schirm.start .nav .knopf:hover::after { transform: translateX(3px); }
.schirm.start > .kurz { grid-area: kurz; margin: 14px 0 0; font-size: 0.9375rem; color: var(--grey); }
.schirm.start > .kurz b { color: var(--ink); }
.schirm.start > .start-unten { grid-area: unten; margin-top: clamp(28px, 5vh, 48px); max-width: 440px; }
.schirm.start .start-unten .hinweis { font-size: 0.8125rem; margin: 0 0 6px; text-align:left; }
.schirm.start details { border: 0 !important; }
.schirm.start details summary { font-size: 0.8125rem; color: var(--grey); padding: 6px 0; }
.schirm.start details p { font-size: 0.8125rem; }
/* Gewinn als Bildflaeche rechts */
.schirm.start > .gewinn { grid-area: bild; align-self: center; position:relative; display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-end; gap: 6px; aspect-ratio: 1 / 1; padding: clamp(24px, 3vw, 40px); margin: 0; border-radius: 28px; overflow:hidden; color:#fff; background: radial-gradient(120% 90% at 85% 0%, #2c4a72 0%, transparent 60%), linear-gradient(160deg, #0b2a4a 0%, #001B35 70%); box-shadow: 0 30px 60px -30px rgba(0,27,53,.55); }
.schirm.start > .gewinn::before { content:""; position:absolute; inset: 8% -14% auto auto; height: 30%; width: auto; aspect-ratio: 1.6; border-radius: 20px; background: linear-gradient(135deg, #f8d26a, #e8a92e); transform: rotate(-9deg); box-shadow: 0 24px 40px -18px rgba(0,0,0,.5); }
.schirm.start > .gewinn::after { content:""; position:absolute; inset: 8% -14% auto auto; height: 30%; width: auto; aspect-ratio: 1.6; border-radius: 20px; background: repeating-linear-gradient(90deg, transparent 0 22px, rgba(255,255,255,.18) 22px 24px); transform: rotate(-9deg); mix-blend-mode: soft-light; }
.schirm.start .gewinn .ikon { position:absolute; top: clamp(24px, 3vw, 40px); left: clamp(24px, 3vw, 40px); width: 56px; height: 56px; border-radius: 16px; display:flex; align-items:center; justify-content:center; background: rgba(255,255,255,.1); color: #f8d26a; }
.schirm.start .gewinn .betrag { position:relative; font-size: clamp(3rem, 1.6rem + 4vw, 5.25rem); font-weight: 800; line-height: .95; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.schirm.start .gewinn b { position:relative; display:block; font-size: clamp(1.125rem, 1rem + .4vw, 1.375rem); line-height: 1.25; font-weight: 700; }
.schirm.start .gewinn .sub { position:relative; margin: 0; font-size: 0.9375rem; line-height: 1.4; color: #c9d4e3; max-width: 30ch; }
/* Tablet und Handy: gestapelt, Gewinn als kompakte Karte zwischen Text und Knopf */
@media (max-width: 900px) {
  main:has(.schirm.start) { max-width: 640px; }
  .schirm.start { grid-template-columns: minmax(0,1fr); grid-template-areas: "spr" "titel" "text" "bild" "nav" "kurz" "unten"; min-height: 0; }
  .schirm.start > .gewinn { aspect-ratio: auto; display:grid; grid-template-columns: auto 1fr; grid-template-areas: "betrag betrag" "b b" "sub sub"; padding: 20px 22px; border-radius: 20px; margin: 0 0 24px; gap: 2px; }
  .schirm.start > .gewinn::before, .schirm.start > .gewinn::after { inset: -34% -12% auto auto; width: 36%; }
  .schirm.start .gewinn .ikon { display:none; }
  .schirm.start .gewinn .betrag { grid-area: betrag; font-size: 2.5rem; margin-bottom: 4px; }
  .schirm.start .gewinn b { grid-area: b; }
  .schirm.start .gewinn .sub { grid-area: sub; margin-top: 2px; }
}
@media (max-width: 520px) {
  .schirm.start > .sprachen { gap: 6px; margin-bottom: 20px; }
  .schirm.start .sprache { font-size: 0.8125rem; padding: 6px 10px 6px 7px; gap: 6px; }
  .flagge { width: 18px; height: 12px; }
  .schirm.start .nav .knopf { width: 100%; }
